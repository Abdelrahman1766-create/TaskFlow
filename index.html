<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta name="description" content="TASKFLOW — make space for what matters." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        document.documentElement.lang = localStorage.getItem('taskflow.locale') === 'ru' ? 'ru' : 'en'
        const savedTheme = localStorage.getItem('taskflow.theme')
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'dark' ? '#24231f' : '#f4f1e9'
    </script>
    <title>TASKFLOW — Make space for what matters</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
